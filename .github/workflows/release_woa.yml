name: Publish ARM64 release

on:
  push:
    branches:
      - WoA_Support

jobs:
  build-release-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        
      - name: Install NuGet
        uses: nuget/setup-nuget@v1
        
      - name: Restore NuGet dependencies
        run: nuget restore
        
      - name: Decode certificate
        shell: bash
        run: echo ${{ secrets.PFX_CERTIFICATE_FILE }} | base64 --decode > ./EverythingToolbar.snk
        
      - name: Build ARM64 release
        run: MSBuild $Env:GITHUB_WORKSPACE /p:Configuration=Release /p:Platform="Any CPU"
        
      - name: Rename ARM64 msi
        shell: bash
        run: mv EverythingToolbar.Installer/bin/ARM64/Release/EverythingToolbar.msi EverythingToolbar-${{ github.ref_name }}-arm64.msi
        
      - name: Generate SHA-256 checksum for ARM64
        shell: bash
        run: sha256sum EverythingToolbar-${{ github.ref_name }}-arm64.msi > EverythingToolbar-${{ github.ref_name }}-arm64.sha256
        
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EverythingToolbar ${{ github.ref_name }} ARM64
          path: |
            EverythingToolbar-${{ github.ref_name }}-arm64.msi
            EverythingToolbar-${{ github.ref_name }}-arm64.sha256
            
      - name: Create or update release with ARM64 assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if release already exists
          $releaseExists = gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            # Release exists, upload ARM64 assets to existing release
            gh release upload "${{ github.ref_name }}" `
              "EverythingToolbar-${{ github.ref_name }}-arm64.msi" `
              "EverythingToolbar-${{ github.ref_name }}-arm64.sha256" `
              --clobber
          } else {
            # Release doesn't exist, create new draft release with ARM64 assets
            gh release create "${{ github.ref_name }}" `
              "EverythingToolbar-${{ github.ref_name }}-arm64.msi" `
              "EverythingToolbar-${{ github.ref_name }}-arm64.sha256" `
              --draft `
              --title "${{ github.ref_name }} (ARM64)"
          }
